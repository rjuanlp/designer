[package]
name = "designer-mcp"
description = "Local MCP server for Designer document sessions"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
designer-core = { path = "../designer-core" }
designer-engine = { path = "../designer-engine" }
rmcp = { version = "=3.10.0", default-features = false, features = [
    "macros",
    "server",
    "transport-io",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = [
    "io-util",
    "macros",
    "process",
    "rt-multi-thread",
] }
