[workspace]
members = [
    "crates/designer-core",
    "crates/designer-engine",
    "crates/designer-render",
    "crates/designer-gpu-bridge",
    "crates/designer-mcp",
    "crates/designer",
]
# Patched third-party source; built as a dependency, never linted as our code.
exclude = ["vendor/gpui"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
accesskit = "=0.25.2"
vello = "=0.12.0"
gpui = { version = "=0.2.2", default-features = false, features = ["windows-manifest"] }
# Must stay on the same minor version as the one wgpu-hal links, because the
# bridge passes its COM interface types to wgpu.
windows = { version = "0.62", default-features = false, features = [
    "std",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Graphics_Direct3D12",
    "Win32_Graphics_Dxgi_Common",
] }
pollster = "0.4"
anyhow = "1"

# GPUI 0.2.2 plus the Windows external-texture patch described in
# vendor/README.md. Remove once upstream can composite a GPU texture.
[patch.crates-io]
gpui = { path = "vendor/gpui" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
